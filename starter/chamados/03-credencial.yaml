apiVersion: apps/v1
kind: Deployment
metadata:
  name: chamado-credencial
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: atendimento
      release: diagnostico-credencial
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: registry.access.redhat.com/ubi9/python-312:latest
        command:
        - python3
        - /app/server.py
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: RELEASE
          value: diagnostico-credencial
        - name: APP_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: plantao-config
              key: APP_MESSAGE
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: plantao-credencial
              key: TOKEN
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
      volumes:
      - name: code
        configMap:
          name: plantao-code
