apiVersion: apps/v1
kind: Deployment
metadata:
  name: atendimento-blue
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: atendimento
      release: blue
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: registry.access.redhat.com/ubi9/python-312:latest
        command:
        - python3
        - /app/server.py
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: RELEASE
          value: blue
        - name: APP_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: plantao-config
              key: APP_MESSAGE
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: plantao-credencial
              key: API_TOKEN
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
      volumes:
      - name: code
        configMap:
          name: plantao-code
---
apiVersion: v1
kind: Service
metadata:
  name: atendimento-blue
spec:
  selector:
    app: atendimento
    release: blue
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: atendimento
spec:
  to:
    kind: Service
    name: atendimento-blue
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
